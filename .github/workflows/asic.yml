name: ASIC

# RTL to GDS on SKY130 with LibreLane (OpenROAD, Magic, Netgen, KLayout).
# Long-running, so it runs on changes under asic/ and on demand, not on every push.
# Each matrix entry is one run of the same design with a different clock target
# and synthesis strategy.
on:
  push:
    paths:
      - "asic/**"
      - ".github/workflows/asic.yml"
  workflow_dispatch:

jobs:
  librelane:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - design: conv_engine
            tag: p33-mc
            overrides: -c CLOCK_PERIOD=33
          - design: conv_engine
            tag: p30-mc
            overrides: -c CLOCK_PERIOD=30
    env:
      LIBRELANE: github:librelane/librelane/3.0.17
      RUN: asic/${{ matrix.design }}/runs/${{ matrix.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix with the LibreLane binary cache
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=

      - name: Cache the SKY130 PDK
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-sky130-librelane-3.0.17

      - name: LibreLane flow
        run: |
          nix develop "$LIBRELANE" --command \
            librelane --run-tag "${{ matrix.tag }}" ${{ matrix.overrides }} "asic/${{ matrix.design }}/config.json"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUN/final/metrics.json" ]; then
            {
              echo "## ${{ matrix.design }} ${{ matrix.tag }} on SKY130 (LibreLane 3.0.17)"
              python3 asic/summary.py "$RUN" --markdown || true
            } >> "$GITHUB_STEP_SUMMARY"
            python3 asic/summary.py "$RUN"
          else
            echo "no final metrics; the flow stopped early" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Timing diagnostics
        if: always()
        run: python3 asic/sta_digest.py "$RUN" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asic-${{ matrix.design }}-${{ matrix.tag }}
          path: |
            ${{ env.RUN }}/final/gds/
            ${{ env.RUN }}/final/metrics.*
            ${{ env.RUN }}/resolved.json
            ${{ env.RUN }}/*-openroad-stapostpnr/
          if-no-files-found: ignore
