name: CI

on:
  push:
  pull_request:

jobs:
  verilator:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install --yes verilator

      - name: Tool versions
        run: verilator --version && python3 --version

      - name: Lint RTL
        run: make lint

      - name: Python golden model self-test
        run: make model-test

      - name: Unit testbenches
        run: make unit

      - name: Top-level integration test
        run: make integ

      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: build/logs/
          if-no-files-found: ignore
