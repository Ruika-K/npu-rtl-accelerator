name: RTL lint

on:
  push:
  pull_request:

jobs:
  verilator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install --yes verilator

      - name: Lint top-level RTL
        run: verilator --lint-only --Wall --Wno-fatal --top-module npu_top rtl/npu_top.sv
