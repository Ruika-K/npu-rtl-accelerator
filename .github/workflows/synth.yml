name: Synthesis

on:
  push:
  pull_request:

jobs:
  xilinx:
    name: xc7 resources (yosys)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install --yes yosys
          curl -sSL -o sv2v.zip https://github.com/zachjs/sv2v/releases/latest/download/sv2v-Linux.zip
          unzip -q sv2v.zip
          sudo install -m 755 sv2v-Linux/sv2v /usr/local/bin/sv2v
          sv2v --version && yosys -V

      - name: Synthesize
        run: make synth-xilinx

      - name: Report
        if: always()
        run: |
          python3 synth/stat_table.py build/synth/xilinx_stat.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xilinx-reports
          path: build/synth/xilinx_stat.txt
          if-no-files-found: ignore

  ecp5:
    # Post-route Fmax can depend on the placement seed, so three
    # seeds run in parallel and each reports its own number and critical path.
    name: ECP5 place and route (nextpnr, seed ${{ matrix.seed }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install --yes yosys nextpnr-ecp5
          curl -sSL -o sv2v.zip https://github.com/zachjs/sv2v/releases/latest/download/sv2v-Linux.zip
          unzip -q sv2v.zip
          sudo install -m 755 sv2v-Linux/sv2v /usr/local/bin/sv2v
          sv2v --version && yosys -V && nextpnr-ecp5 --version

      - name: Synthesize, place and route
        run: make synth-ecp5 PNR_SEED=${{ matrix.seed }}

      - name: Report
        if: always()
        run: |
          {
            echo '## ECP5 LFE5U-85F, nextpnr-ecp5 --freq 100, seed ${{ matrix.seed }}'
            echo '```'
            python3 synth/nextpnr_summary.py build/synth/nextpnr.log build/synth/npu_top_ooc.v
            echo '```'
            echo 'Yosys ABC warnings (with the pass they come from):'
            echo '```'
            awk '/^[0-9.]+ Executing/{h=$0} /ABC: execution of command/{print h; print}' build/synth/ecp5.log | head -20
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Raw critical path
        # The summary labels each segment with a signal name, which can be an
        # arbitrary neighbour inside a mapped cone; the raw report has the cells
        # and the placement coordinates of every hop.
        if: always()
        run: |
          awk '/Critical path report for clock/{n=1; buf=""} n{buf=buf $0 "\n"} n && /ns logic, .* ns routing/{last=buf; n=0} END{printf "%s", last}' build/synth/nextpnr.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecp5-reports-seed${{ matrix.seed }}
          path: |
            build/synth/ecp5_stat.txt
            build/synth/nextpnr.log
          if-no-files-found: ignore
